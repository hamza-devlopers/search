    <div class="container" id="page2">
        <a href="#page1" class="page3Link">Home</a>

        <div class="box_2">
            <div class="plusIcon">
                <button>+</button>
            </div>
            <div class="searchBar">
                <form action="https://www.google.com/search" method="get">
                    <input type="text" placeholder="Search google" name="q">
            </div>
            <input type="hidden" name="tbm" value="isch">
            <div class="mic">
                <img src="./images/micIcon.PNG" alt="Mic_Icon">
            </div>
            <div class="lens">
                <img src="./images/GoogleLens.PNG" alt="Mic_Icon">
            </div>

        </div>
        <button type="submit" class="button" value="Google Search">Google Search</button>
    </div>
    </form>
    <div class="AdvancedSearch" id="page3">
        <a href="#page1" class="threePage">Home</a>

        <div class="topSide">

            <div class="circle">A</div>
        </div>
        <div class="line"></div>
        <h1>Advanced Search</h1>
        <div class="boxPart">
            <h3>Find pages with</h3>
            <form action="https://www.google.com/search" method="get">
                <div class="FirstBox">
                    <span>All of these words: </span>
                    <input type="text" name="as_q">
                </div>
                <div class="FirstBox">
                    <span>This exact word or phrase: </span>
                    <input type="text" name="as_epq">
                </div>
                <div class="FirstBox">
                    <span>None of these words: </span>
                    <input type="text" name="as_eq">
                </div>
                <div class="FirstBox">
                    <span>Site or domain: </span>
                    <input type="text" name="as_sitesearch">
                </div>
        </div>
        <button type="submit" class="LastButton" value="Advanced Search">Advanced Search</button>
        </form>
